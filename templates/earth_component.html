<div class="earth-wrapper">
    <div class="earth-container" id="earth-container">
        <div id="earth-canvas"></div>
        <!-- Legend -->
        <div class="earth-legend">
            <div class="legend-item"><span class="legend-dot" style="background:#ff4444;">🔥</span> Wildfire</div>
            <div class="legend-item"><span class="legend-dot" style="background:#ffaa00;">🌀</span> Storm</div>
            <div class="legend-item"><span class="legend-dot" style="background:#ff6b35;">🌋</span> Volcano</div>
            <div class="legend-item"><span class="legend-dot" style="background:#44ff88;">🌊</span> Earthquake</div>
            <div class="legend-item"><span class="legend-dot" style="background:#44bbff;">💧</span> Flood</div>
        </div>
    </div>
</div>

<!-- Three.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // ============================================================
    // 3D EARTH WITH EVENT MARKERS
    // ============================================================

    (function() {
        const container = document.getElementById('earth-container');
        if (!container) return;

        const width = container.clientWidth;
        const height = container.clientHeight || 450;

        // Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 0, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        const canvasContainer = document.getElementById('earth-canvas');
        canvasContainer.appendChild(renderer.domElement);

        // Stars
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starsPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i++) {
            starsPositions[i] = (Math.random() - 0.5) * 300;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({
            color: 0x888899,
            size: 0.12,
            transparent: true,
            opacity: 0.5
        });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // Earth
        const earthGroup = new THREE.Group();
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        const earthMaterial = new THREE.MeshPhongMaterial({
            map: earthTexture,
            specular: new THREE.Color(0x333333),
            shininess: 5
        });
        const earthGeometry = new THREE.SphereGeometry(1.2, 64, 64);
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        earthGroup.add(earth);

        // Glow
        const glowMaterial = new THREE.MeshPhongMaterial({
            color: 0x1a237e,
            transparent: true,
            opacity: 0.04,
            side: THREE.BackSide
        });
        const glowGeometry = new THREE.SphereGeometry(1.3, 32, 32);
        const glow = new THREE.Mesh(glowGeometry, glowMaterial);
        earthGroup.add(glow);
        scene.add(earthGroup);

        // Lights
        scene.add(new THREE.AmbientLight(0x404060));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(5, 3, 5);
        scene.add(directionalLight);
        const backLight = new THREE.DirectionalLight(0x4488ff, 0.5);
        backLight.position.set(-5, 0, -5);
        scene.add(backLight);

        // ============================================================
        // CREATE SPRITE ICONS
        // ============================================================

        function createIconSprite(type, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 64, 64);

            // Glow background
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
            const hexColor = '#' + color.toString(16).padStart(6, '0');
            gradient.addColorStop(0, hexColor + '30');
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(32, 32, 30, 0, Math.PI * 2);
            ctx.fill();

            // Emoji
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '28px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';

            let emoji = '📍';
            if (type === 'wildfire') emoji = '🔥';
            else if (type === 'storm') emoji = '🌀';
            else if (type === 'volcano') emoji = '🌋';
            else if (type === 'earthquake') emoji = '🌊';
            else if (type === 'flood') emoji = '💧';

            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 6;
            ctx.fillStyle = '#fff';
            ctx.fillText(emoji, 32, 34);

            // Border ring
            ctx.shadowBlur = 0;
            ctx.strokeStyle = hexColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(32, 32, 18, 0, Math.PI * 2);
            ctx.stroke();

            // Center glow dot
            ctx.fillStyle = hexColor;
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.arc(32, 32, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;

            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: true,
                depthWrite: false,
                opacity: 0.95
            });

            const sprite = new THREE.Sprite(material);
            sprite.scale.set(0.12, 0.12, 1);
            return sprite;
        }

        function latLonToPosition(lat, lon, radius) {
            const phi = (90 - lat) * Math.PI / 180;
            const theta = lon * Math.PI / 180;
            return new THREE.Vector3(
                radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        // ============================================================
        // REALISTIC EVENT LOCATIONS
        // ============================================================

        const events = [
            // Wildfires (California, Australia, Mediterranean, Brazil)
            { lat: 34.05, lon: -118.24, type: 'wildfire', color: 0xff4444 },
            { lat: 37.77, lon: -122.42, type: 'wildfire', color: 0xff4444 },
            { lat: 40.71, lon: -124.00, type: 'wildfire', color: 0xff4444 },
            { lat: -33.87, lon: 151.21, type: 'wildfire', color: 0xff4444 },
            { lat: -37.81, lon: 144.96, type: 'wildfire', color: 0xff4444 },
            { lat: 43.00, lon: -7.00, type: 'wildfire', color: 0xff4444 },
            { lat: 41.90, lon: 12.50, type: 'wildfire', color: 0xff4444 },
            { lat: -15.80, lon: -47.86, type: 'wildfire', color: 0xff4444 },

            // Storms (US Gulf, India, SE Asia, Japan)
            { lat: 25.00, lon: -80.00, type: 'storm', color: 0xffaa00 },
            { lat: 29.76, lon: -95.37, type: 'storm', color: 0xffaa00 },
            { lat: 20.59, lon: 78.96, type: 'storm', color: 0xffaa00 },
            { lat: 22.57, lon: 88.36, type: 'storm', color: 0xffaa00 },
            { lat: 10.82, lon: 106.63, type: 'storm', color: 0xffaa00 },
            { lat: 14.60, lon: 120.98, type: 'storm', color: 0xffaa00 },
            { lat: 35.68, lon: 139.76, type: 'storm', color: 0xffaa00 },

            // Volcanoes (Ring of Fire, Italy, Iceland)
            { lat: 35.68, lon: 139.76, type: 'volcano', color: 0xff6b35 },
            { lat: 19.43, lon: -99.13, type: 'volcano', color: 0xff6b35 },
            { lat: -8.34, lon: 115.09, type: 'volcano', color: 0xff6b35 },
            { lat: -6.10, lon: 105.40, type: 'volcano', color: 0xff6b35 },
            { lat: 37.75, lon: 14.99, type: 'volcano', color: 0xff6b35 },
            { lat: 40.82, lon: 14.43, type: 'volcano', color: 0xff6b35 },
            { lat: 63.63, lon: -19.62, type: 'volcano', color: 0xff6b35 },

            // Earthquakes (Japan, Himalayas, Turkey, Taiwan)
            { lat: 35.68, lon: 139.76, type: 'earthquake', color: 0x44ff88 },
            { lat: 23.50, lon: 120.80, type: 'earthquake', color: 0x44ff88 },
            { lat: 28.61, lon: 77.20, type: 'earthquake', color: 0x44ff88 },
            { lat: 27.70, lon: 85.32, type: 'earthquake', color: 0x44ff88 },
            { lat: 39.93, lon: 32.86, type: 'earthquake', color: 0x44ff88 },
            { lat: 37.98, lon: 23.72, type: 'earthquake', color: 0x44ff88 },
            { lat: 55.75, lon: 37.62, type: 'earthquake', color: 0x44ff88 },

            // Floods (Monsoon regions, River deltas)
            { lat: 28.61, lon: 77.20, type: 'flood', color: 0x44bbff },
            { lat: 22.57, lon: 88.36, type: 'flood', color: 0x44bbff },
            { lat: 23.81, lon: 90.41, type: 'flood', color: 0x44bbff },
            { lat: 19.08, lon: 72.87, type: 'flood', color: 0x44bbff },
            { lat: 51.51, lon: -0.13, type: 'flood', color: 0x44bbff },
            { lat: 40.71, lon: -74.01, type: 'flood', color: 0x44bbff },
            { lat: 37.77, lon: -122.42, type: 'flood', color: 0x44bbff },
        ];

        // ============================================================
        // ADD MARKERS TO EARTH
        // ============================================================

        const markers = [];

        events.forEach(event => {
            const pos = latLonToPosition(event.lat, event.lon, 1.22);

            // Icon sprite
            const sprite = createIconSprite(event.type, event.color);
            sprite.position.copy(pos);
            earthGroup.add(sprite);

            // Pulse ring
            const ringGeo = new THREE.RingGeometry(0.035, 0.07, 24);
            const ringMat = new THREE.MeshBasicMaterial({
                color: event.color,
                transparent: true,
                opacity: 0.5,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(pos);
            ring.lookAt(new THREE.Vector3(0, 0, 0));
            earthGroup.add(ring);

            markers.push({
                sprite: sprite,
                ring: ring,
                phase: Math.random() * Math.PI * 2
            });
        });

        // ============================================================
        // ANIMATION
        // ============================================================

        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.005;

            earthGroup.rotation.y += 0.002;

            markers.forEach((marker) => {
                const pulse = 1 + 0.4 * Math.sin(time * 2 + marker.phase);
                marker.ring.scale.set(pulse, pulse, pulse);
                marker.ring.material.opacity = 0.3 + 0.3 * Math.sin(time * 2 + marker.phase);
            });

            renderer.render(scene, camera);
        }
        animate();

        // ============================================================
        // RESIZE HANDLER
        // ============================================================

        function onResize() {
            const newWidth = container.clientWidth;
            const newHeight = container.clientHeight || 450;
            camera.aspect = newWidth / newHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(newWidth, newHeight);
        }

        window.addEventListener('resize', onResize);

        // Also resize when container changes (e.g., tab visibility)
        const observer = new ResizeObserver(() => onResize());
        observer.observe(container);

        console.log('🌍 3D Earth loaded successfully!');
    })();
</script>
